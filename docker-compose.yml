version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ia-render-api
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - UVICORN_WORKERS=2
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
